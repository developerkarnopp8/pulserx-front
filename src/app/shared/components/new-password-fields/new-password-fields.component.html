<div [formGroup]="form" class="flex flex-col gap-4">
  <div class="flex flex-col gap-1">
    <label [for]="idPrefix + '-senha'" class="text-on-surface-variant text-xs font-medium uppercase tracking-wide">Nova senha</label>
    <div class="flex items-center gap-3 bg-surface-container rounded-sm px-4 min-h-[48px] focus-within:ring-1 focus-within:ring-primary-fixed">
      <span class="material-symbols-outlined text-outline text-[18px] shrink-0" aria-hidden="true">lock</span>
      <input [id]="idPrefix + '-senha'" formControlName="password" [type]="show() ? 'text' : 'password'" autocomplete="new-password"
        class="min-w-0 flex-1 bg-transparent text-on-surface text-sm" [attr.aria-describedby]="idPrefix + '-criterio'" />
      <button type="button" (click)="show.set(!show())" [attr.aria-label]="show() ? 'Esconder a senha' : 'Mostrar a senha'"
        class="shrink-0 min-w-[44px] min-h-[44px] -mr-3 flex items-center justify-center text-outline hover:text-on-surface-variant">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">{{ show() ? 'visibility_off' : 'visibility' }}</span>
      </button>
    </div>
    <p [id]="idPrefix + '-criterio'" class="flex items-center gap-1.5 text-xs mt-1"
      [class.text-primary-fixed]="longEnough" [class.text-on-surface-variant]="!longEnough">
      <span class="material-symbols-outlined text-[16px]" aria-hidden="true">{{ longEnough ? 'check_circle' : 'radio_button_unchecked' }}</span>
      Mínimo de {{ min }} caracteres
    </p>
  </div>

  <div class="flex flex-col gap-1">
    <label [for]="idPrefix + '-confirma'" class="text-on-surface-variant text-xs font-medium uppercase tracking-wide">Repita a senha</label>
    <div class="flex items-center gap-3 bg-surface-container rounded-sm px-4 min-h-[48px] focus-within:ring-1 focus-within:ring-primary-fixed">
      <span class="material-symbols-outlined text-[18px] shrink-0" aria-hidden="true"
        [class.text-primary-fixed]="matches" [class.text-outline]="!matches">{{ matches ? 'check' : 'sync_alt' }}</span>
      <input [id]="idPrefix + '-confirma'" formControlName="confirm" [type]="show() ? 'text' : 'password'" autocomplete="new-password"
        class="min-w-0 flex-1 bg-transparent text-on-surface text-sm" />
    </div>
    @if (form.hasError('diferentes') && form.get('confirm')?.touched) {
      <p class="text-error text-xs">As senhas não são iguais.</p>
    }
  </div>
</div>
