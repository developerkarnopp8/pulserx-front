@if (open) {
  <div class="fixed inset-0 bg-black/80 flex items-end sm:items-center justify-center z-[70] animate-fade-in" (click)="cancel()">
    <div class="bg-surface-container-low rounded-t-md sm:rounded-md w-full sm:max-w-sm p-5 flex flex-col gap-4 animate-slide-up max-h-[90vh] overflow-y-auto"
      role="dialog" aria-modal="true" aria-labelledby="titulo-pular" (click)="$event.stopPropagation()">

      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="font-headline text-[11px] font-bold uppercase tracking-widest text-primary-fixed">Ajuste do treino</p>
          <h3 id="titulo-pular" class="font-headline font-black text-xl text-on-surface uppercase leading-tight">Por que vai pular?</h3>
        </div>
        <button type="button" (click)="cancel()" aria-label="Fechar"
          class="w-11 h-11 -mr-2 -mt-1 flex items-center justify-center text-on-surface-variant hover:text-on-surface shrink-0">
          <span class="material-symbols-outlined text-[22px]" aria-hidden="true">close</span>
        </button>
      </div>

      <div class="flex flex-col gap-2" role="radiogroup" aria-label="Motivo">
        @for (r of reasons; track r.value) {
          <button type="button" role="radio" [attr.aria-checked]="selectedReason() === r.value" (click)="selectReason(r.value)"
            class="min-h-[48px] w-full flex items-center gap-3 px-4 rounded-sm text-left border transition-colors"
            [class.border-primary-fixed]="selectedReason() === r.value" [class.bg-surface-container]="selectedReason() === r.value"
            [class.border-outline-variant/20]="selectedReason() !== r.value" [class.bg-surface-container-lowest]="selectedReason() !== r.value">
            <span class="w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0"
              [class.border-primary-fixed]="selectedReason() === r.value" [class.border-outline]="selectedReason() !== r.value" aria-hidden="true">
              @if (selectedReason() === r.value) { <span class="w-2.5 h-2.5 rounded-full bg-primary-fixed"></span> }
            </span>
            <span class="flex flex-col">
              <span class="text-sm text-on-surface flex items-center gap-1.5">
                @if (r.value === 'Injury') {
                  <span class="material-symbols-outlined text-[18px] text-tertiary" aria-hidden="true">medical_services</span>
                }
                {{ r.label }}
              </span>
              @if (r.value === 'Injury') {
                <span class="text-[11px] text-on-surface-variant">Dado de saúde (LGPD) — você autorizou compartilhar com o coach</span>
              }
            </span>
          </button>
        }
      </div>

      @if (!healthConsent) {
        <p class="flex items-start gap-2 text-on-surface-variant text-xs">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">info</span>
          Para informar lesão/dor ou escrever o motivo, ative o compartilhamento de dados de saúde no Perfil.
        </p>
      }

      @if (noteRequired) {
        <label class="flex flex-col gap-1">
          <span class="font-headline text-[11px] font-bold uppercase tracking-widest text-on-surface-variant">Observação para o coach</span>
          <textarea [(ngModel)]="note" rows="2" placeholder="Descreva o motivo..."
            class="w-full bg-surface-container text-on-surface placeholder:text-outline rounded-sm px-3 py-2.5 text-sm resize-none"></textarea>
        </label>
      }

      <div class="flex flex-col gap-2">
        <p class="font-headline text-[11px] font-bold uppercase tracking-widest text-on-surface-variant">E esse treino, o que vai acontecer?</p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" (click)="selectDecision('Postponed')" [attr.aria-pressed]="selectedDecision() === 'Postponed'"
            class="min-h-[48px] rounded-sm font-headline text-xs font-bold uppercase tracking-wider transition-colors"
            [class.bg-primary-fixed]="selectedDecision() === 'Postponed'" [class.text-on-primary-fixed]="selectedDecision() === 'Postponed'"
            [class.bg-surface-container]="selectedDecision() !== 'Postponed'" [class.text-on-surface-variant]="selectedDecision() !== 'Postponed'">
            Retomar depois
          </button>
          <button type="button" (click)="selectDecision('Abandoned')" [attr.aria-pressed]="selectedDecision() === 'Abandoned'"
            class="min-h-[48px] rounded-sm font-headline text-xs font-bold uppercase tracking-wider transition-colors"
            [class.bg-error]="selectedDecision() === 'Abandoned'" [class.text-on-error]="selectedDecision() === 'Abandoned'"
            [class.bg-surface-container]="selectedDecision() !== 'Abandoned'" [class.text-on-surface-variant]="selectedDecision() !== 'Abandoned'">
            Não vou fazer
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <button type="button" (click)="confirm()" [disabled]="!canConfirm"
          class="min-h-[52px] rounded-sm bg-primary-fixed disabled:opacity-40 text-on-primary-fixed font-headline font-black text-sm uppercase tracking-wider flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">fast_forward</span>
          Confirmar e pular
        </button>
        <button type="button" (click)="cancel()"
          class="min-h-[44px] rounded-sm text-on-surface-variant hover:text-on-surface font-headline text-xs uppercase tracking-wider">
          Voltar ao treino
        </button>
      </div>
    </div>
  </div>
}
