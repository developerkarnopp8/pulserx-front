  <app-workout-history-calendar [logs]="logs()" [avgSessionSeconds]="avgSessionSeconds()" />

  <!-- AI Insight -->
  <div class="bg-tertiary/10 border border-tertiary/30 rounded-xl p-4 mt-4">

    <p class="text-on-surface text-sm leading-relaxed">
      Sua recuperação na terça foi abaixo do ideal. Reduz a carga de cardio hoje em 15%.

  </div>

</div>
